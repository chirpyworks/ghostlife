name: Publish GitHub release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Create v1.0.0 release
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists."
          else
            gh release create v1.0.0               --target "${GITHUB_SHA}"               --title "GHOSTLIFE v1.0.0"               --notes-file CHANGELOG.md
          fi
