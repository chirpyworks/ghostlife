name: Public Release Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          scan() {
            label="$1"
            pattern="$2"
            if grep -RqE --exclude-dir=.git --exclude='*.md' --exclude='LICENSE' "$pattern" .; then
              echo "Potential secret pattern detected: $label"
              fail=1
            fi
          }

          scan "OpenAI-style secret" 'sk-[A-Za-z0-9_-]{20,}'
          scan "GitHub PAT" 'ghp_[A-Za-z0-9]{20,}'
          scan "GitHub fine-grained PAT" 'github_pat_[A-Za-z0-9_]{20,}'
          scan "Private key block" 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          scan "Client secret assignment" 'client_secret[[:space:]]*[:=]'
          scan "Password assignment" 'password[[:space:]]*[:=]'

          if [ "$fail" -ne 0 ]; then
            echo "Public release blocked."
            exit 1
          fi

          echo "No blocked credential pattern found."

      - name: Verify open-source license
        run: |
          test -f LICENSE
          grep -qi "MIT License" LICENSE
          grep -qi "open-source" README.md
